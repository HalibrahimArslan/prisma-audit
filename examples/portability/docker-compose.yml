# Databases of this example's own. The demo has a PostgreSQL of its own on
# another port, and these checks empty every schema they touch, so they must
# never be pointed at it.
services:
  mysql:
    image: mysql:8
    # Prisma's adapter for the `mysql` provider is the MariaDB connector, which
    # does not speak MySQL 8's default caching_sha2_password. This is a fact
    # about connecting to MySQL from Node, not about auditing, but the checks
    # cannot run without settling it.
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: audit
      MYSQL_DATABASE: audit
      MYSQL_USER: audit
      MYSQL_PASSWORD: audit
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uaudit", "-paudit"]
      interval: 3s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 3s
      retries: 30
